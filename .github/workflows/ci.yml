name: Firmware checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JSON parser for shared configuration and UI fixtures
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev
      - name: Fetch exact LVGL source used by firmware
        run: git clone --depth 1 --branch v9.3.0 https://github.com/lvgl/lvgl.git .test-deps/lvgl
      - name: Render real 320x480 UI and verify DEMO separation
        run: |
          python3 tools/test_ui.py --review --sanitize
          python3 tools/test_ui.py --sanitize
          python3 tools/test_ui.py --review
          python3 tools/render_review.py --no-run
      - name: Install pinned browser test runner
        run: npm install --prefix .test-deps/panel-node --no-audit --no-fund playwright@1.51.1
      - name: Verify real panel assets against shared C configuration and LVGL
        shell: bash
        run: |
          export NODE_PATH="$PWD/.test-deps/panel-node/node_modules"
          export DSR_TEST_CHROME="$(command -v google-chrome || command -v chromium)"
          python3 tools/serve_panel_test.py > build-ui/panel-host.log 2>&1 &
          panel_pid=$!
          trap 'kill "$panel_pid"' EXIT
          python3 -c 'import socket,time; [(time.sleep(.2)) for _ in range(50) if socket.socket().connect_ex(("127.0.0.1",8765)) != 0]'
          node tests/test_panel.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-lvgl-ui-review-NOT-FIRMWARE
          path: |
            build-ui/review-export/
            build-ui/review-export.zip
            build-ui/panel-review/
          if-no-files-found: error
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install real JSON parser for protocol fixtures
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev
      - name: Portable C tests with address and undefined behavior sanitizers
        run: |
          python3 tools/test.py --sanitize
          python3 tools/test_config.py --sanitize
  diagnostic:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
    # These are compile coverage targets, NOT supported hardware profiles.
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
      - name: Compile unconfigured diagnostic application
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build -D DSR_DIAGNOSTIC_BUILD=ON set-target ${{ matrix.target }}
          idf.py -B build -D DSR_DIAGNOSTIC_BUILD=ON build
      - name: Retain diagnostic ELF and map only (no flashable release)
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-only-${{ matrix.target }}
          path: |
            build/diy_shelly_remote.elf
            build/diy_shelly_remote.map
          if-no-files-found: error
  es3c35p:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
      - name: Build LCDWiki ES3C35P local switch development firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-board -D DSR_BOARD=lcdwiki-es3c35p set-target esp32s3
          idf.py -B build-board -D DSR_BOARD=lcdwiki-es3c35p build
          python3 - <<'PY'
          from pathlib import Path
          sdk=Path('sdkconfig').read_text()
          for option in ['CONFIG_BT_ENABLED=y','CONFIG_BT_NIMBLE_ENABLED=y','CONFIG_BT_NIMBLE_ROLE_OBSERVER=y','CONFIG_ESP_COEX_SW_COEXIST_ENABLE=y','CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y','CONFIG_BT_NIMBLE_PINNED_TO_CORE_1=y','CONFIG_BT_CTRL_PINNED_TO_CORE_1=y']:
              assert option in sdk, option
          for option in ['CONFIG_BT_NIMBLE_ROLE_CENTRAL=y','CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=y','CONFIG_BT_NIMBLE_ROLE_BROADCASTER=y']:
              assert option not in sdk, option
          print('PASS: real SDK NimBLE observer-only, PSRAM and coexistence configuration')
          PY
          idf.py -B build-board -D DSR_BOARD=lcdwiki-es3c35p merge-bin -o "$GITHUB_WORKSPACE/build-board/DIY-Shelly-Remote-es3c35p-local.bin"
          cd build-board
          sha256sum DIY-Shelly-Remote-es3c35p-local.bin diy_shelly_remote.bin > SHA256SUMS.txt
      - name: Package USB image, instructions and license notices
        shell: bash
        run: |
          mkdir -p build-board/package/bootloader build-board/package/partition_table build-board/package/licenses
          cp build-board/DIY-Shelly-Remote-es3c35p-local.bin build-board/diy_shelly_remote.bin build-board/SHA256SUMS.txt build-board/flasher_args.json build-board/ota_data_initial.bin build-board/package/
          cp build-board/bootloader/bootloader.bin build-board/package/bootloader/
          cp build-board/partition_table/partition-table.bin build-board/package/partition_table/
          cp dependencies.lock build-board/package/
          cp docs/CONFIG_WEB_PL.md build-board/package/INSTALL_AND_TEST.md
          cp docs/ISSUE6_UI.md docs/ISSUE7_LAN.md docs/REVIEW_FIXES.md docs/UNIFIED_UI.md docs/ISSUE12_TELEMETRY.md build-board/package/
          cp docs/ISSUE15_COVER.md build-board/package/
          cp docs/STABLE_POLLING.md build-board/package/
          cp docs/BLE_PLAN.md build-board/package/
          cp docs/FEATURE_MATRIX.md build-board/package/
          cp boards/lcdwiki-es3c35p/README.md build-board/package/BOARD_REFERENCE.md
          cp LICENSE NOTICE.md third_party/xiaozhi-esp32-LICENSE third_party/Roboto-LICENSE build-board/package/licenses/
          cp third_party/material-symbols/LICENSE build-board/package/licenses/Material-Symbols-Apache-2.0.txt
          cp "$IDF_PATH/LICENSE" build-board/package/licenses/ESP-IDF-Apache-2.0.txt
          cp managed_components/lvgl__lvgl/LICENCE.txt build-board/package/licenses/LVGL-MIT.txt
          python3 tools/package_licenses.py --idf "$IDF_PATH" --managed managed_components --out build-board/package/licenses/vendor
          printf 'Source commit: %s\nTested commit: %s\n' '${{ github.event.pull_request.head.sha || github.sha }}' "$GITHUB_SHA" > build-board/package/BUILD_COMMIT.txt
      - name: Retain local switch development firmware
        uses: actions/upload-artifact@v4
        with:
          name: es3c35p-local-switch-NOT-STABLE
          path: build-board/package/
          if-no-files-found: error
