name: Firmware checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install JSON parser for shared configuration and UI fixtures
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev python3-pil python3-reportlab
      - name: Fetch exact LVGL source used by firmware
        run: git clone --depth 1 --branch v9.3.0 https://github.com/lvgl/lvgl.git .test-deps/lvgl
      - name: Render real 320x480 UI and verify DEMO separation
        run: |
          python3 tools/check_cyber_icons.py
          python3 tools/test_ui.py --review --sanitize
          python3 tools/test_ui.py --sanitize
          python3 tools/test_ui.py --review
          python3 tools/render_review.py --no-run
          python3 tools/render_cyber_atlas.py --screens build-ui/asan/screenshots --out build-ui/cyber-atlas --base-ref 5d33c2c9a755ba5b5c3692b97d766f6a6e21a04e
          python3 tools/render_cyber_final.py --screens build-ui/asan/screenshots --out build-ui/cyber-atlas
          python3 tools/render_skin_atlas.py --screens build-ui/asan/screenshots --out build-ui/skin-atlas
      - name: Install pinned browser test runner
        run: npm install --prefix .test-deps/panel-node --no-audit --no-fund playwright@1.51.1
      - name: Verify real panel assets against shared C configuration and LVGL
        shell: bash
        run: |
          export NODE_PATH="$PWD/.test-deps/panel-node/node_modules"
          export DSR_TEST_CHROME="$(command -v google-chrome || command -v chromium)"
          python3 tools/serve_panel_test.py > build-ui/panel-host.log 2>&1 &
          panel_pid=$!
          trap 'kill "$panel_pid"' EXIT
          python3 -c 'import socket,time; [(time.sleep(.2)) for _ in range(50) if socket.socket().connect_ex(("127.0.0.1",8765)) != 0]'
          node tests/test_panel.cjs
          node tests/test_panel_runtime.cjs
          node tests/test_panel_runtime_model.cjs
          node tests/test_panel_actions_model.cjs
          node tests/test_panel_actions_async.cjs
          node tests/test_panel_config_reads.cjs
          node tests/test_panel_actions.cjs
          node tests/test_panel_automation.cjs
          node tests/test_panel_ap_model.cjs
          node tests/test_panel_ble_model.cjs
          node tests/test_panel_onboarding_model.cjs
          node tests/test_web_locale_dictionary.cjs
          node tests/test_panel_locale.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-lvgl-ui-review-NOT-FIRMWARE
          path: |
            build-ui/review-export/
            build-ui/review-export.zip
            build-ui/cyber-atlas/
            build-ui/Cyber_Blue_Atlas.zip
            build-ui/skin-atlas/
            build-ui/panel-review/
            build-ui/panel-locale/
            build-ui/panel-runtime/
            build-ui/panel-actions/
            build-ui/panel-automation/
          if-no-files-found: error
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install real JSON parser for protocol fixtures
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev python3-cryptography libssl-dev
      - name: Portable C tests with address and undefined behavior sanitizers
        run: |
          python3 tools/test.py --sanitize
          python3 tools/test_config.py --sanitize
          python3 tools/test_automation.py --case all --sanitize
      - name: Verify blank provisioning with original pinned IDF SPIFFS
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch v5.5.4 https://github.com/espressif/esp-idf.git .test-deps/esp-idf
          git -C .test-deps/esp-idf sparse-checkout set components/spiffs components/http_parser components/json
          git -C .test-deps/esp-idf submodule update --init --depth 1 components/spiffs/spiffs components/json/cJSON
          python3 tools/test_idf_spiffs.py --sanitize
      - name: Verify raw HTTP fragmentation with original pinned IDF parser
        run: python3 tools/test_ota_fetch_parser.py --idf .test-deps/esp-idf --sanitize
      - name: Verify release corpus with original pinned IDF cJSON and full sanitizers
        run: |
          python3 tools/test_ota_release.py --cjson-source .test-deps/esp-idf/components/json/cJSON --sanitize
          python3 tools/test_ota_discovery.py --cjson-source .test-deps/esp-idf/components/json/cJSON --sanitize
      - name: Verify single-release HTTPS metadata with original pinned IDF cJSON
        run: python3 tools/test_ota_release_fetch.py --cjson-source .test-deps/esp-idf/components/json/cJSON --sanitize
      - name: Verify release-to-signed-app chain with original pinned IDF cJSON
        run: python3 tools/test_ota_release_chain.py --cjson-source .test-deps/esp-idf/components/json/cJSON --sanitize
  diagnostic:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
    # These are compile coverage targets, NOT supported hardware profiles.
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile unconfigured diagnostic application
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build -D DSR_DIAGNOSTIC_BUILD=ON set-target ${{ matrix.target }}
          idf.py -B build -D DSR_DIAGNOSTIC_BUILD=ON build
          python3 tools/check_ota_diagnostic.py --bin build/diy_shelly_remote.bin
      - name: Retain diagnostic ELF and map only (no flashable release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostic-only-${{ matrix.target }}
          path: |
            build/diy_shelly_remote.elf
            build/diy_shelly_remote.map
          if-no-files-found: error
  es3c35p:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build LCDWiki ES3C35P local switch development firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-board -D DSR_BOARD=lcdwiki-es3c35p set-target esp32s3
          idf.py -B build-board -D DSR_BOARD=lcdwiki-es3c35p build
          idf.py -B build-board size
          python3 tools/check_boot_memory.py --elf build-board/diy_shelly_remote.elf --sdkconfig sdkconfig --out build-board/BOOT_MEMORY.json
          python3 tools/check_automation_target.py --build build-board
          python3 tools/verify_crypto_vendor.py
          python3 tools/check_ota_binary.py --elf build-board/diy_shelly_remote.elf --bin build-board/diy_shelly_remote.bin --out build-board/OTA_VERIFIER.json
          python3 tools/check_ota_image_target.py --build-dir build-board --elf build-board/diy_shelly_remote.elf --upload --out build-board/OTA_IMAGE.json
          python3 tools/check_ota_fetch_target.py --build-dir build-board --elf build-board/diy_shelly_remote.elf --sdkconfig sdkconfig --out build-board/OTA_FETCH.json
          python3 tools/check_ota_release_target.py --build-dir build-board --elf build-board/diy_shelly_remote.elf --out build-board/OTA_RELEASE.json
          python3 tools/check_ota_release_fetch_target.py --build-dir build-board --elf build-board/diy_shelly_remote.elf --out build-board/OTA_RELEASE_FETCH.json
          python3 tools/check_ota_release_chain_target.py --build-dir build-board --elf build-board/diy_shelly_remote.elf --out build-board/OTA_RELEASE_CHAIN.json
          python3 tools/check_restart_target.py --build-dir build-board --elf build-board/diy_shelly_remote.elf --out build-board/RESTART.json
          python3 tools/check_editor_target.py --build-dir build-board --out build-board/EDITOR.json
          python3 tools/check_fleet_target.py --build-dir build-board --out build-board/FLEET.json
          python3 tools/check_ap_target.py --build-dir build-board --out build-board/AP.json
          python3 tools/check_native_ota_target.py --build-dir build-board --elf build-board/diy_shelly_remote.elf --out build-board/NATIVE_OTA.json
          python3 tools/check_ble_target.py --build-dir build-board --out build-board/BLE.json
          python3 tools/check_actions_target.py --build-dir build-board --out build-board/ACTIONS.json
          python3 tools/check_pairing_target.py --build-dir build-board --elf build-board/diy_shelly_remote.elf --out build-board/PAIRING.json
          python3 - <<'PY'
          from pathlib import Path
          sdk=Path('sdkconfig').read_text()
          for option in ['CONFIG_BT_ENABLED=y','CONFIG_BT_NIMBLE_ENABLED=y','CONFIG_BT_NIMBLE_ROLE_CENTRAL=y','CONFIG_BT_NIMBLE_GATT_CLIENT=y','CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1','CONFIG_BT_NIMBLE_SECURITY_ENABLE=y','CONFIG_BT_NIMBLE_SM_LEGACY=y','CONFIG_BT_NIMBLE_SM_SC=y','CONFIG_BT_NIMBLE_NVS_PERSIST=y','CONFIG_BT_NIMBLE_MAX_BONDS=16','CONFIG_BT_NIMBLE_ROLE_OBSERVER=y','CONFIG_ESP_COEX_SW_COEXIST_ENABLE=y','CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y','CONFIG_BT_NIMBLE_PINNED_TO_CORE_1=y','CONFIG_BT_CTRL_PINNED_TO_CORE_1=y']:
              assert option in sdk, option
          for option in ['CONFIG_BT_NIMBLE_SM_SC_DEBUG_KEYS=y','CONFIG_BT_NIMBLE_HANDLE_REPEAT_PAIRING_DELETION=y','CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=y','CONFIG_BT_NIMBLE_ROLE_BROADCASTER=y']:
              assert option not in sdk, option
          for option in ['CONFIG_SPI_FLASH_YIELD_DURING_ERASE=y','CONFIG_SPI_FLASH_ERASE_YIELD_DURATION_MS=20','CONFIG_SPI_FLASH_ERASE_YIELD_TICKS=1']:
              assert option in sdk, option
          print('PASS: real SDK NimBLE single central + observer, BLU SMP/persistent bonds, no auto eviction/debug keys, PSRAM and coexistence configuration')
          PY
      - name: Collect license notices and build reports
        shell: bash
        run: |
          mkdir -p build-board/licenses build-board/reports
          cp LICENSE NOTICE.md third_party/xiaozhi-esp32-LICENSE third_party/Roboto-LICENSE build-board/licenses/
          cp components/dsr_crypto/vendor/LICENCE.md build-board/licenses/MONOCYPHER_LICENCE.md
          cp third_party/material-symbols/LICENSE build-board/licenses/Material-Symbols-Apache-2.0.txt
          cp components/dsr_ui/cyber_icons/LICENSE.txt build-board/licenses/Cyber-Blue-Icons-CC0.txt
          cp "$IDF_PATH/LICENSE" build-board/licenses/ESP-IDF-Apache-2.0.txt
          cp managed_components/lvgl__lvgl/LICENCE.txt build-board/licenses/LVGL-MIT.txt
          python3 tools/package_licenses.py --idf "$IDF_PATH" --managed managed_components --out build-board/licenses/vendor
          cp build-board/[A-Z]*.json dependencies.lock build-board/reports/
          printf 'Source commit: %s\nTested commit: %s\n' '${{ github.event.pull_request.head.sha || github.sha }}' "$GITHUB_SHA" > build-board/reports/BUILD_COMMIT.txt
      - name: Prepare and verify separate FACTORY16MiB and app-only UPDATE packages
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python3 tools/test_factory.py
          python3 tools/package_factory.py --build-dir build-board --sdkconfig sdkconfig --idf "$IDF_PATH" --out build-board/installers --source '${{ github.event.pull_request.head.sha || github.sha }}' --tested "$GITHUB_SHA"
          CC=gcc python3 tools/test_idf_spiffs.py --idf-source "$IDF_PATH" --cjson-source "$IDF_PATH/components/json/cJSON" --factory-image build-board/installers/FACTORY-CLEAN-16MB/dsrdata.bin --verification-report build-board/installers/FACTORY-CLEAN-16MB/SPIFFS_MOUNT_PROOF.json --ubsan-only
          cp docs/INSTALL_FACTORY_PL.md docs/STORAGE_RECOVERY_PL.md tools/storage_recovery.py build-board/installers/FACTORY-CLEAN-16MB/
          cp docs/INSTALL_UPDATE_PL.md build-board/installers/UPDATE-APP-ONLY/
          cp -r build-board/licenses build-board/installers/FACTORY-CLEAN-16MB/
          cp -r build-board/licenses build-board/installers/UPDATE-APP-ONLY/
          python3 tools/check_factory_package.py --package-dir build-board/installers
          python3 tools/test_factory.py --package-dir build-board/installers
      - name: Retain full clean FACTORY image (destructive installation variant)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: es3c35p-FACTORY-CLEAN-16MB-NOT-STABLE
          path: build-board/installers/FACTORY-CLEAN-16MB/
          if-no-files-found: error
      - name: Retain app-only UPDATE (no filesystem or partition image)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: es3c35p-UPDATE-APP-ONLY-NOT-STABLE
          path: build-board/installers/UPDATE-APP-ONLY/
          if-no-files-found: error
      - name: Retain build reports (no flashable image)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: es3c35p-build-reports-NOT-FIRMWARE
          path: build-board/reports/
          if-no-files-found: error
      - name: Retain target debug symbols and effective configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: es3c35p-debug-symbols-NOT-FIRMWARE
          path: |
            build-board/diy_shelly_remote.elf
            build-board/diy_shelly_remote.map
            build-board/BOOT_MEMORY.json
            sdkconfig
          if-no-files-found: error
