name: Firmware checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install real JSON parser for protocol fixtures
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev
      - name: Portable C tests with address and undefined behavior sanitizers
        run: python3 tools/test.py --sanitize
  diagnostic:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
    # These are compile coverage targets, NOT supported hardware profiles.
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
      - name: Compile unconfigured diagnostic application
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build -D DSR_DIAGNOSTIC_BUILD=ON set-target ${{ matrix.target }}
          idf.py -B build -D DSR_DIAGNOSTIC_BUILD=ON build
      - name: Retain diagnostic ELF and map only (no flashable release)
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-only-${{ matrix.target }}
          path: |
            build/diy_shelly_remote.elf
            build/diy_shelly_remote.map
          if-no-files-found: error
  es3c35p:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
      - name: Build LCDWiki ES3C35P local switch development firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-board -D DSR_BOARD=lcdwiki-es3c35p set-target esp32s3
          idf.py -B build-board -D DSR_BOARD=lcdwiki-es3c35p build
          idf.py -B build-board -D DSR_BOARD=lcdwiki-es3c35p merge-bin -o "$GITHUB_WORKSPACE/build-board/DIY-Shelly-Remote-es3c35p-local.bin"
          cd build-board
          sha256sum DIY-Shelly-Remote-es3c35p-local.bin diy_shelly_remote.bin > SHA256SUMS.txt
      - name: Package USB image, instructions and license notices
        shell: bash
        run: |
          mkdir -p build-board/package/bootloader build-board/package/partition_table build-board/package/licenses
          cp build-board/DIY-Shelly-Remote-es3c35p-local.bin build-board/diy_shelly_remote.bin build-board/SHA256SUMS.txt build-board/flasher_args.json build-board/ota_data_initial.bin build-board/package/
          cp build-board/bootloader/bootloader.bin build-board/package/bootloader/
          cp build-board/partition_table/partition-table.bin build-board/package/partition_table/
          cp dependencies.lock build-board/package/
          cp docs/LOCAL_CONTROL_PL.md build-board/package/INSTALL_AND_TEST.md
          cp boards/lcdwiki-es3c35p/README.md build-board/package/BOARD_REFERENCE.md
          cp LICENSE NOTICE.md third_party/xiaozhi-esp32-LICENSE build-board/package/licenses/
          cp "$IDF_PATH/LICENSE" build-board/package/licenses/ESP-IDF-Apache-2.0.txt
          cp managed_components/lvgl__lvgl/LICENCE.txt build-board/package/licenses/LVGL-MIT.txt
          printf 'Source commit: %s\nTested commit: %s\n' '${{ github.event.pull_request.head.sha || github.sha }}' "$GITHUB_SHA" > build-board/package/BUILD_COMMIT.txt
      - name: Retain local switch development firmware
        uses: actions/upload-artifact@v4
        with:
          name: es3c35p-local-switch-NOT-STABLE
          path: build-board/package/
          if-no-files-found: error
