name: Repair DEV catalogue description
# Owner's failed OTA check on 0.7.52: repair only the published description.
# The one-time request pins release id, old body hash, tag/source and all assets.
on:
  push:
    branches: ['work/p0-spiffs-ota-brand']
    paths: ['.github/repair-notes-0.7.53.json']
permissions:
  contents: read
concurrency:
  group: repair-dev-v0.7.53-notes
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install the real catalogue parser dependency
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev
      - name: Verify publication and repair decisions, including native parser regressions
        run: python3 tools/test_release_tool.py
      - name: Repair description, validate with firmware parser, read back immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_tool.py repair-notes --repo "$GITHUB_REPOSITORY" --request .github/repair-notes-0.7.53.json
